<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yicheng · Job Application Tracker</title><style>body{font-family:system-ui;margin:0;background:#f5f5f3;color:#171717}.wrap{max-width:1400px;margin:auto;padding:36px}.top{display:flex;justify-content:space-between;align-items:end}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.card,.panel{background:#fff;border:1px solid #e5e5e2;border-radius:14px}.card{padding:18px}.n{font-size:28px;font-weight:750}.muted{color:#777;font-size:13px}.toolbar{padding:14px;display:flex;gap:10px}.toolbar input,.toolbar select{padding:10px;border:1px solid #ddd;border-radius:9px}.toolbar input{flex:1}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#777}.tablewrap{overflow:auto}.pill{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.Rejected{background:#fbeeed;color:#b43b32}.Review{background:#edf3fb;color:#3567a8}.Interview{background:#fff3d8;color:#9a6b16}.Offer{background:#e9f6ef;color:#1f7a4d}button{padding:10px 14px;border:1px solid #ddd;background:#fff;border-radius:9px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:18px}}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">CAREER DASHBOARD · BERLIN</div><h1>Job Application Tracker</h1><div class="muted">投递、回复、面试与结果，一处追踪。数据由聊天截图持续更新。</div></div><button onclick="exportCSV()">导出 CSV</button></div><div class="stats" id="stats"></div><div class="panel"><div class="toolbar"><input id="q" placeholder="搜索公司 / 岗位 / 方向…" oninput="render()"><select id="sf" onchange="render()"><option value="">全部状态</option><option>Review</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div><div class="tablewrap"><table><thead ['Mimosa Management','Digital Product & Operations Intern','Product Operations / Project Coordination','Internship','','Review','','未披露','Application submitted on 20 Sep 2026; exact submission time not provided.']];function fmt(s){if(!s)return'—';let d=new Date(s);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}function rt(a,b){if(!a||!b)return'—';let h=(new Date(b)-new Date(a))/36e5;return h<24?Math.round(h)+'h':(h/24).toFixed(1)+'d'}function render(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('sf').value;let rows=data.filter(x=>(!q||x.join(' ').toLowerCase().includes(q))&&(!s||x[5]===s));document.getElementById('body').innerHTML=rows.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${fmt(x[4])}</td><td><span class="pill ${x[5]}">${x[5]}</span></td><td>${fmt(x[6])}</td><td>${rt(x[4],x[6])}</td><td>${x[7]}</td><td>${x[8]}</td></tr>`).join('');let active=data.filter(x=>['Review','Review','Interview'].includes(x[5])).length,rej=data.filter(x=>x[5]==='Rejected').length,off=data.filter(x=>x[5]==='Offer').length,rep=data.filter(x=>x[4]&&x[6]);let avg=rep.length?rep.reduce((n,x)=>n+(new Date(x[6])-new Date(x[4]))/864e5,0)/rep.length:0;document.getElementById('stats').innerHTML=[[data.length,'总投递'],[active,'进行中'],[rej,'已拒绝'],[off,'Offer'],[avg.toFixed(1)+'d','平均首次回复']].map(x=>`<div class="card"><div class="n">${x[0]}</div><div class="muted">${x[1]}</div></div>`).join('')}const VERSION='2026-09-24-akqa';async function checkLatest(){try{let r=await fetch(location.pathname+'?version_check='+Date.now(),{cache:'no-store'}),t=await r.text();if(!t.includes("const VERSION='"+VERSION+"'")){location.replace(location.pathname+'?v='+Date.now())}}catch(e){}}setTimeout(checkLatest,1500);setInterval(checkLatest,60000);window.addEventListener('focus',checkLatest);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkLatest()});function exportCSV(){let rows=[['Company','Role','Direction','Type','Review','Status','Reply','Salary','Notes'],...data];let b=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='job_applications.csv';a.click()}render()</script></body></html>
